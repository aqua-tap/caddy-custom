name: Build image and push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-demo-image:${{ github.sha }}

    - name: Scan Image with Aqua SaaS
      run: docker run --rm -v /tmp:/tmp -v /var/run/docker.sock:/var/run/docker.sock registry.aquasec.com/scanner:latest-saas scan --registry "Docker Hub" mongo:latest --host https://uniqueid.cloud.aquasec.com/ --user $USER --password $PASSWORD --show-negligible --htmlfile out.html --jsonfile out.json > /dev/null

#    - name: Tag image with Registry
#      run: |
#        
#        docker tag my-demo-image:${{ github.sha }} my-registry/my-demo-image:${{ github.sha }}

    - name: Push to Registry
      run: echo "docker push my-registry/my-demo-image:${{ github.sha }}"
